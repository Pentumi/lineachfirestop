[build]
  publish = "."
  # Pure static HTML — no build command

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# netlify.app subdomain is not canonical: send it to the apex
[[redirects]]
  from = "https://lineachfirestop.netlify.app/*"
  to = "https://lineachfirestop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lineachfirestop.netlify.app/*"
  to = "https://lineachfirestop.com/:splat"
  status = 301
  force = true

# /index.html duplicates of directory URLs
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:a/index.html"
  to = "/:a/"
  status = 301
  force = true

[[redirects]]
  from = "/:a/:b/index.html"
  to = "/:a/:b/"
  status = 301
  force = true

# Apex is canonical: www → lineachfirestop.com
[[redirects]]
  from = "https://www.lineachfirestop.com/*"
  to = "https://lineachfirestop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lineachfirestop.com/*"
  to = "https://lineachfirestop.com/:splat"
  status = 301
  force = true

# Dublin pretty URL: old no-slash and .html → trailing slash
[[redirects]]
  from = "/areas/dublin"
  to = "/areas/dublin/"
  status = 301

[[redirects]]
  from = "/areas/dublin.html"
  to = "/areas/dublin/"
  status = 301

