[build]
  publish = "."
  # Pure static HTML — no build command

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Apex is canonical: www → lineachfirestop.com
[[redirects]]
  from = "https://www.lineachfirestop.com/*"
  to = "https://lineachfirestop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lineachfirestop.com/*"
  to = "https://lineachfirestop.com/:splat"
  status = 301
  force = true
